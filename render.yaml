# Render blueprint: New + > Blueprint > pick this repo. Fill in the secret values when asked (never commit them).
services:
  - type: web
    name: brandproof
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY      # main AI (Google AI Studio)
        sync: false
      - key: GROQ_API_KEY        # backup AI and the independent second opinion (console.groq.com)
        sync: false
      - key: DATABASE_URL        # Supabase "Session pooler" connection string
        sync: false
      - key: SUPABASE_URL        # optional: Supabase Auth for sign-in (Project Settings > API)
        sync: false
      - key: SUPABASE_ANON_KEY   # optional: the public "anon" key, not the service-role key
        sync: false
      - key: SESSION_SECRET      # optional: random string; otherwise one is generated and kept in the database
        generateValue: true
